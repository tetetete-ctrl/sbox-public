name: Build s&box (Windows)

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [master]      # change to your fork's default branch if different

permissions:
  contents: read

# Cancel older runs of the same branch when a new commit lands
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Bootstrap (download deps + build engine)
        shell: cmd
        run: Setup.bat --verbose

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: sbox-windows-${{ github.sha }}
          path: game/
          retention-days: 7
          if-no-files-found: error
